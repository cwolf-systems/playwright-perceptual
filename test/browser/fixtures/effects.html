<!doctype html>
<meta charset="utf-8" />
<style>
  :root {
    --shadow: rgba(20, 40, 80, 0.3);
  }
  body {
    margin: 0;
    width: 320px;
    height: 200px;
    display: grid;
    place-items: center;
    background: #eef1f5;
  }
  .card {
    width: 200px;
    height: 110px;
    border-radius: 16px;
    background: linear-gradient(160deg, #ffffff, #dfe7f2);
    box-shadow:
      0 12px 28px var(--shadow),
      0 2px 6px rgba(0, 0, 0, 0.12);
  }
  .glow {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #f6b44a;
    filter: blur(14px);
  }
</style>
<div class="glow"></div>
<div class="card"></div>
<script>
  const variant = new URLSearchParams(location.search).get('variant');
  const root = document.documentElement.style;
  if (variant === 'subtle') root.setProperty('--shadow', 'rgba(20, 40, 80, 0.305)');
  if (variant === 'regression') root.setProperty('--shadow', 'rgba(160, 30, 30, 0.45)');
  if (variant === 'faint') root.setProperty('--shadow', 'rgba(20, 40, 80, 0.4)');
</script>
