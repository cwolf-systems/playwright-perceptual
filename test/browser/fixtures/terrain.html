<!doctype html>
<meta charset="utf-8" />
<style>
  body {
    margin: 0;
  }
</style>
<canvas width="320" height="200"></canvas>
<script>
  // A height field with slope shading. Shading uses screen-space derivatives, which GPUs and
  // software rasterisers compute slightly differently: the case this package is for.
  const canvas = document.querySelector('canvas');
  const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
  // Firefox has no WebGL 2 on machines without a GPU; say so instead of leaving the page blank.
  document.body.dataset.webgl = gl ? 'available' : 'unavailable';
  if (gl) draw(gl);

  function draw(gl) {
    const compile = (type, source) => {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      return shader;
    };
    const program = gl.createProgram();
    gl.attachShader(
      program,
      compile(
        gl.VERTEX_SHADER,
        `#version 300 es
    in vec2 p;
    out vec2 uv;
    void main() { uv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }`,
      ),
    );
    gl.attachShader(
      program,
      compile(
        gl.FRAGMENT_SHADER,
        `#version 300 es
    precision highp float;
    in vec2 uv;
    out vec4 colour;
    uniform vec3 light;
    void main() {
      float h = 0.5 + 0.25 * sin(uv.x * 9.0) * cos(uv.y * 7.0) + 0.1 * sin(uv.x * 31.0 + uv.y * 17.0);
      vec3 n = normalize(vec3(-dFdx(h) * 40.0, -dFdy(h) * 40.0, 1.0));
      float lit = clamp(dot(n, normalize(light)), 0.0, 1.0);
      vec3 ramp = mix(vec3(0.18, 0.32, 0.2), vec3(0.85, 0.75, 0.55), h);
      colour = vec4(ramp * (0.35 + 0.65 * lit), 1.0);
    }`,
      ),
    );
    gl.linkProgram(program);
    gl.useProgram(program);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
    const position = gl.getAttribLocation(program, 'p');
    gl.enableVertexAttribArray(position);
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
    // The subtle variant turns the light by a fraction of a degree; the regression moves it across.
    const variant = new URLSearchParams(location.search).get('variant');
    const light = {
      subtle: [-0.6, 0.502, 0.6],
      regression: [0.6, -0.5, 0.6],
      faint: [-0.6, 0.6, 0.6],
    }[variant] ?? [-0.6, 0.5, 0.6];
    gl.uniform3fv(gl.getUniformLocation(program, 'light'), light);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
</script>
