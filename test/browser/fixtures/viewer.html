<!doctype html>
<meta charset="utf-8" />
<style>
  body {
    margin: 0;
  }
  canvas {
    display: block;
  }
</style>
<canvas width="320" height="200"></canvas>
<script>
  // A 3D mission view: a perspective terrain mesh with hillshading, a colour ramp by height,
  // contour lines and distance fog, and drones with altitude stems and tracks above it.
  //
  // Variants: subtle turns the sun a fraction of a degree; shifted nudges the camera 0.3 px;
  // regression drops a drone; faint darkens the contour lines.
  const variant = new URLSearchParams(location.search).get('variant');

  const canvas = document.querySelector('canvas');
  const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true, antialias: false });
  document.body.dataset.webgl = gl ? 'available' : 'unavailable';

  const GRID = 96;
  const RELIEF = 0.32;
  const SKY = [0.8, 0.86, 0.92];
  const EYE = [0, 1.05, 2.3];
  const TARGET = [0, 0.05, -0.2];
  const FOV = Math.PI / 4;
  const NUDGE_PX = variant === 'shifted' ? 0.3 : 0;
  const SUN = variant === 'subtle' ? [-0.5, 0.701, 0.3] : [-0.5, 0.7, 0.3];
  const CONTOUR_ALPHA = variant === 'faint' ? 0.55 : 0.35;

  const ground = (x, z) =>
    RELIEF *
    (0.5 +
      0.3 * Math.sin(x * 2.1 + 0.4) * Math.cos(z * 1.7) +
      0.15 * Math.sin(x * 5.3 - z * 3.1) +
      0.05 * Math.cos(x * 11 + z * 9));

  const DRONES = [
    {
      colour: [0, 0.51, 0.56],
      track: [
        [-0.9, 0.3],
        [-0.6, 0.05],
        [-0.3, -0.25],
        [-0.05, -0.4],
      ],
    },
    {
      colour: [0.94, 0.42, 0],
      track: [
        [0.9, 0.6],
        [0.6, 0.35],
        [0.4, 0.05],
        [0.3, -0.3],
      ],
    },
    {
      colour: [0.42, 0.2, 0.62],
      track: [
        [-0.2, 0.9],
        [0.0, 0.6],
        [0.15, 0.35],
        [0.1, 0.12],
      ],
    },
  ].filter((_, i) => !(variant === 'regression' && i === 1));
  const ALTITUDE = 0.22;

  const subtract = (a, b) => a.map((v, i) => v - b[i]);
  const normalize = (v) => v.map((x) => x / Math.hypot(...v));
  const cross = ([a, b, c], [d, e, f]) => [b * f - c * e, c * d - a * f, a * e - b * d];
  const dot = (a, b) => a.reduce((sum, v, i) => sum + v * b[i], 0);

  /** Column-major view-projection matrix for a camera at `eye` looking at `target`. */
  function viewProjection() {
    const forward = normalize(subtract(TARGET, EYE));
    const right = normalize(cross(forward, [0, 1, 0]));
    const up = cross(right, forward);
    const aspect = canvas.width / canvas.height;
    const f = 1 / Math.tan(FOV / 2);
    const near = 0.1;
    const far = 10;
    const view = [
      [right[0], up[0], -forward[0], 0],
      [right[1], up[1], -forward[1], 0],
      [right[2], up[2], -forward[2], 0],
      [-dot(right, EYE), -dot(up, EYE), dot(forward, EYE), 1],
    ];
    const projection = [
      [f / aspect, 0, 0, 0],
      [0, f, 0, 0],
      [0, 0, (far + near) / (near - far), -1],
      [0, 0, (2 * far * near) / (near - far), 0],
    ];
    const result = [];
    for (let c = 0; c < 4; c++) {
      for (let r = 0; r < 4; r++) {
        result.push(view[c].reduce((sum, v, k) => sum + projection[k][r] * v, 0));
      }
    }
    return new Float32Array(result);
  }

  function program(vertex, fragment) {
    const p = gl.createProgram();
    for (const [type, source] of [
      [gl.VERTEX_SHADER, vertex],
      [gl.FRAGMENT_SHADER, fragment],
    ]) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      gl.attachShader(p, shader);
    }
    gl.linkProgram(p);
    return p;
  }

  function attribute(p, name, data, size) {
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
    const location = gl.getAttribLocation(p, name);
    gl.enableVertexAttribArray(location);
    gl.vertexAttribPointer(location, size, gl.FLOAT, false, 0, 0);
  }

  // Moves everything by a fraction of a pixel on screen, as a camera nudged by that much would.
  const NUDGE_GLSL = `gl_Position.x += nudge * gl_Position.w;`;

  function drawTerrain(matrix) {
    const p = program(
      `#version 300 es
      in vec3 position;
      in vec3 normal;
      uniform mat4 viewProjection;
      uniform float nudge;
      out vec3 world;
      out vec3 surface;
      void main() {
        world = position;
        surface = normal;
        gl_Position = viewProjection * vec4(position, 1.0);
        ${NUDGE_GLSL}
      }`,
      `#version 300 es
      precision highp float;
      in vec3 world;
      in vec3 surface;
      uniform vec3 sun;
      uniform vec3 eye;
      uniform vec3 sky;
      uniform float contourAlpha;
      out vec4 colour;
      const float RELIEF = ${RELIEF.toFixed(3)};
      const float WATER = 0.2;
      const float INTERVAL = 0.06;
      vec3 ramp(float h) {
        vec3 low = vec3(0.45, 0.6, 0.38);
        vec3 mid = vec3(0.78, 0.72, 0.5);
        vec3 high = vec3(0.62, 0.52, 0.44);
        vec3 peak = vec3(0.94, 0.93, 0.9);
        if (h < 0.45) return mix(low, mid, (h - WATER) / (0.45 - WATER));
        if (h < 0.75) return mix(mid, high, (h - 0.45) / 0.3);
        return mix(high, peak, (h - 0.75) / 0.25);
      }
      void main() {
        float h = world.y / RELIEF;
        float lit = max(dot(normalize(surface), normalize(sun)), 0.0);
        vec3 c = h < WATER ? vec3(0.4, 0.58, 0.74) : ramp(h) * (0.42 + 0.58 * lit);
        float k = h / INTERVAL;
        float edge = abs(fract(k - 0.5) - 0.5) / fwidth(k);
        float line = (1.0 - min(edge, 1.0)) * step(WATER, h);
        c = mix(c, vec3(0.22, 0.17, 0.12), line * contourAlpha);
        c = mix(c, sky, smoothstep(1.9, 3.6, distance(world, eye)));
        colour = vec4(c, 1.0);
      }`,
    );
    gl.useProgram(p);

    const positions = [];
    const normals = [];
    const STEP = 2 / GRID;
    for (let j = 0; j <= GRID; j++) {
      for (let i = 0; i <= GRID; i++) {
        const x = -1 + i * STEP;
        const z = -1 + j * STEP;
        positions.push(x, ground(x, z), z);
        const dx = (ground(x + STEP, z) - ground(x - STEP, z)) / (2 * STEP);
        const dz = (ground(x, z + STEP) - ground(x, z - STEP)) / (2 * STEP);
        normals.push(...normalize([-dx, 1, -dz]));
      }
    }
    const indices = [];
    for (let j = 0; j < GRID; j++) {
      for (let i = 0; i < GRID; i++) {
        const a = j * (GRID + 1) + i;
        const b = a + GRID + 1;
        indices.push(a, b, a + 1, a + 1, b, b + 1);
      }
    }
    attribute(p, 'position', positions, 3);
    attribute(p, 'normal', normals, 3);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

    gl.uniformMatrix4fv(gl.getUniformLocation(p, 'viewProjection'), false, matrix);
    gl.uniform1f(gl.getUniformLocation(p, 'nudge'), (2 * NUDGE_PX) / canvas.width);
    gl.uniform3fv(gl.getUniformLocation(p, 'sun'), SUN);
    gl.uniform3fv(gl.getUniformLocation(p, 'eye'), EYE);
    gl.uniform3fv(gl.getUniformLocation(p, 'sky'), SKY);
    gl.uniform1f(gl.getUniformLocation(p, 'contourAlpha'), CONTOUR_ALPHA);
    gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);
  }

  function drawDrones(matrix) {
    const p = program(
      `#version 300 es
      in vec3 position;
      uniform mat4 viewProjection;
      uniform float nudge;
      uniform float size;
      void main() {
        gl_Position = viewProjection * vec4(position, 1.0);
        ${NUDGE_GLSL}
        gl_PointSize = size;
      }`,
      `#version 300 es
      precision highp float;
      uniform vec3 tint;
      uniform bool round;
      out vec4 colour;
      void main() {
        if (round && distance(gl_PointCoord, vec2(0.5)) > 0.5) discard;
        colour = vec4(tint, 1.0);
      }`,
    );
    gl.useProgram(p);
    gl.uniformMatrix4fv(gl.getUniformLocation(p, 'viewProjection'), false, matrix);
    gl.uniform1f(gl.getUniformLocation(p, 'nudge'), (2 * NUDGE_PX) / canvas.width);

    const draw = (mode, points, colour, size, round) => {
      attribute(p, 'position', points.flat(), 3);
      gl.uniform3fv(gl.getUniformLocation(p, 'tint'), colour);
      gl.uniform1f(gl.getUniformLocation(p, 'size'), size);
      gl.uniform1i(gl.getUniformLocation(p, 'round'), round ? 1 : 0);
      gl.drawArrays(mode, 0, points.length);
    };

    for (const { colour, track } of DRONES) {
      const path = track.map(([x, z]) => [x, ground(x, z) + ALTITUDE, z]);
      const [x, y, z] = path.at(-1);
      draw(gl.LINE_STRIP, path, colour, 1, false);
      draw(
        gl.LINES,
        [
          [x, ground(x, z), z],
          [x, y, z],
        ],
        [0.15, 0.15, 0.18],
        1,
        false,
      );
      draw(gl.POINTS, [[x, y, z]], [1, 1, 1], 11, true);
      draw(gl.POINTS, [[x, y, z]], colour, 7, true);
    }
  }

  if (gl) {
    const matrix = viewProjection();
    gl.clearColor(...SKY, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    drawTerrain(matrix);
    // Markers stay visible through terrain, as map markers do.
    gl.disable(gl.DEPTH_TEST);
    drawDrones(matrix);
  }
</script>
