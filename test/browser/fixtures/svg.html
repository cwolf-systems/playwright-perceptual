<!doctype html>
<meta charset="utf-8" />
<style>
  body {
    margin: 0;
    background: white;
  }
  .shifted svg {
    transform: translate(0.3px, 0.2px);
  }
</style>
<svg width="320" height="200" viewBox="0 0 320 200" fill="none" stroke="#24476b" stroke-width="1.5">
  <circle cx="50" cy="60" r="28" />
  <path d="M110 88 L140 32 L170 88 Z" stroke-linejoin="round" />
  <rect x="200" y="34" width="56" height="52" rx="10" />
  <path id="star" d="M60 120 l9 18 20 3 -14 14 3 20 -18 -9 -18 9 3 -20 -14 -14 20 -3 Z" />
  <path d="M130 170 C160 110 200 200 240 130" stroke="#c0392b" stroke-width="2" />
  <line x1="260" y1="120" x2="300" y2="180" stroke-linecap="round" />
</svg>
<script>
  const variant = new URLSearchParams(location.search).get('variant');
  if (variant === 'shifted') document.body.classList.add('shifted');
  if (variant === 'regression') document.getElementById('star').remove();
  if (variant === 'faint') document.querySelector('svg').setAttribute('stroke', '#2f5a85');
</script>
